name: Auto Deploy CloudFlare-ImgBed to Pages

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码并拉取原作者的仓库（注意：修正了 name 的描述）
      - name: Checkout CloudFlare-ImgBed Repository
        uses: actions/checkout@v4
        with:
          repository: 'MarSeventh/CloudFlare-ImgBed'

      # 2. 安装 Node.js 运行环境
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      # 3. 安装依赖并编译前端代码（【避坑】新版项目推荐这里直接用 npm install，它会顺带触发内置的打包逻辑）
      - name: Install Dependencies and Build
        run: |
          npm install

      # 4. 自动化给你的 Cloudflare D1 数据库建表
      - name: Initialize D1 Database Structure
        run: |
          if [ -f "./database/init.sql" ]; then
            npx wrangler d1 execute img_d1 --remote --file=./database/init.sql --yes
          else
            echo "SQL file not found, skipping DB init."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./frontend-dist --project-name=imgbed
