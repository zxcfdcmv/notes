name: Deploy NextChat to Cloudflare Pages

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: 'ChatGPTNextWeb/NextChat'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18 # 保持 Node 18 规避高版本依赖 bug
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Bypass Build Check (强制绕过冲突与代码检查)
        run: |
          if [ -f "next.config.js" ]; then
            sed -i "s/module.exports = nextConfig/nextConfig.eslint = { ignoreDuringBuilds: true }; nextConfig.typescript = { ignoreBuildErrors: true }; module.exports = nextConfig/g" next.config.js
            echo "Successfully patched next.config.js"
          elif [ -f "next.config.mjs" ]; then
            sed -i "s/export default nextConfig/nextConfig.eslint = { ignoreDuringBuilds: true }; nextConfig.typescript = { ignoreBuildErrors: true }; export default nextConfig/g" next.config.mjs
            echo "Successfully patched next.config.mjs"
          fi

      - name: Build Static Export
        run: npx cross-env BUILD_MODE=export BUILD_APP=1 yarn mask && npx cross-env BUILD_MODE=export BUILD_APP=1 next build
        env:
          CODE: ${{ secrets.CODE }}

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./out --project-name=ai --branch=main
