name: Deploy NextChat to Cloudflare Pages

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: 'ChatGPTNextWeb/NextChat'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Bypass Build Check & Server Actions Error
        run: |
          if [ -f "next.config.js" ]; then
            sed -i "s/module.exports = nextConfig/nextConfig.eslint = { ignoreDuringBuilds: true }; nextConfig.typescript = { ignoreBuildErrors: true }; module.exports = nextConfig/g" next.config.js
            sed -i "s/output: \"export\"/output: \"standalone\"/g" next.config.js
            echo "Successfully patched next.config.js"
          elif [ -f "next.config.mjs" ]; then
            sed -i "s/export default nextConfig/nextConfig.eslint = { ignoreDuringBuilds: true }; nextConfig.typescript = { ignoreBuildErrors: true }; export default nextConfig/g" next.config.mjs
            sed -i "s/output: 'export'/output: 'standalone'/g" next.config.mjs
            echo "Successfully patched next.config.mjs"
          fi

      - name: Build Project
        run: npx cross-env BUILD_MODE=standalone BUILD_APP=1 yarn mask && npx cross-env BUILD_MODE=standalone BUILD_APP=1 next build
        env:
          CODE: ${{ secrets.CODE }}

      - name: Copy Static Files For Cloudflare Pages
        run: |
          mkdir -p out
          
          if [ -d ".next/server/app" ]; then
            cp -r .next/server/app/* out/ || true
          fi
          if [ -d ".next/server/pages" ]; then
            cp -r .next/server/pages/* out/ || true
          fi
          
          if [ -f "out/page.html" ] && [ ! -f "out/index.html" ]; then
            mv out/page.html out/index.html
          fi

          mkdir -p out/_next
          if [ -d ".next/static" ]; then
            cp -r .next/static out/_next/static || true
          fi
          
          if [ -d "public" ]; then
            cp -r public/* out/ || true
          fi
          
          echo "=== 检查 out 目录结构 ==="
          ls -R out

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./out --project-name=ai --branch=main
