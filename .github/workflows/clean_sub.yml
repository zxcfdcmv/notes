name: Auto Clean Multiple Subs to Release

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Download Pure Subconverter Binary
        run: |
          echo "正在从官方开源仓库下载就地转换器..."
          curl -sL -o subconverter.tar.gz https://github.com/tindy2013/subconverter/releases/download/v0.9.0/subconverter_linux64.tar.gz
          tar -xzf subconverter.tar.gz

      - name: Fetch, Merge and Filter Multiple Nodes
        run: |
          # 1. 填入所有订阅
          SUBS_ARRAY=(
            "https://d.zrfme.com/vless-base64"
            "https://raw.githubusercontent.com/snakem982/proxypool/main/source/v2ray-2.txt"
          )
          
          touch all_decoded_merged.txt
          touch clean_443_merged.txt
          
          # 2. 遍历处理所有订阅链接
          for sub in "${SUBS_ARRAY[@]}"; do
            echo "正在处理订阅: $sub"
            
            if echo "$sub" | grep -qE "\.(yaml|yml|json)" || echo "$sub" | grep -qE "(clash|singbox|sing-box)"; then
               echo "检测到配置格式(YAML/JSON)，正在进行本地转换..."
               printf "[General]\n[Profile]\ntarget=v2ray\nurl=%s\noutput=output_v2ray.txt\n" "$sub" > ./subconverter/generate.ini
               cd subconverter && ./subconverter -g > /dev/null 2>&1 && cd ..
               RAW_DATA=$(cat ./subconverter/output_v2ray.txt 2>/dev/null || echo "")
               rm -f ./subconverter/output_v2ray.txt ./subconverter/generate.ini
            else
               RAW_DATA=$(curl -sL "$sub")
            fi
            
            TRY_DECODE=$(echo "$RAW_DATA" | base64 -d 2>/dev/null || echo "")
            if echo "$TRY_DECODE" | grep -qE "(vless|vmess|trojan|ss|ssr)://"; then
                echo "-> 成功识别并解密 Base64 订阅源"
                DECODED="$TRY_DECODE"
            else
                echo "-> 识别为明文订阅源（或已被转换器摊平）"
                DECODED="$RAW_DATA"
            fi
            
            # C. 追加合流与清洗
            if [ ! -z "$DECODED" ]; then
              echo "$DECODED" >> all_decoded_merged.txt
              
              echo "$DECODED" | grep -E "://[^#]+:443" >> clean_443_merged.txt || true
            fi
          done
          
          # 3. 去重与防空文件兜底
          SORTED_ALL=$(sort -u all_decoded_merged.txt)
          SORTED_CLEAN=$(sort -u clean_443_merged.txt)
          
          if [ -z "$SORTED_CLEAN" ]; then
             SORTED_CLEAN="# No 443 nodes found at this time, waiting for next update."
          fi
          
          # 最终导出为 dae 兼容的 Base64 密文
          echo "$SORTED_ALL" | base64 -w0 > all_nodes.txt
          echo "$SORTED_CLEAN" | base64 -w0 > clean_443_nodes.txt
          echo "所有订阅均已安全清洗合并完成！"

      - name: Upload or Update Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Cleaned Subs"
          body: "由纯安全、无日志泄漏的 GitHub Actions 本地二进制定时清洗的优质 443 节点"
          files: |
            all_nodes.txt
            clean_443_nodes.txt
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
