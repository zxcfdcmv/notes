name: Auto Deploy Cloudflare-Nav to Workers

on:
  schedule:
    - cron: '0 0 * * 1' # 每周一自动拉取原作者最新代码更新
  workflow_dispatch:   # 支持手动点击按钮触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 直接拉取原作者的仓库（免去你自己 Fork 的麻烦）
      - name: Checkout Cloudflare-Nav Repository
        uses: actions/checkout@v4
        with:
          repository: 'wangwangit/nav'

      - name: Generate Wrangler Config
        run: |
          cat <<EOF > wrangler.toml
          name = "nav"
          account_id = "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          main = "src/index.ts"
          compatibility_date = "2024-01-01"

          [[d1_databases]]
          binding = "NAV_DB"
          database_name = "nav-db"
          database_id = "${{ secrets.NAV_D1_ID }}"

          [[kv_namespaces]]
          binding = "NAV_AUTH"
          id = "${{ secrets.NAV_KV_ID }}"
          EOF

      - name: Initialize D1 Database Structure
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute nav-db --remote --file=./schema.sql --yes

      - name: Publish to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy src/index.js
